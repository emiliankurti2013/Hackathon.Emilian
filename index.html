
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMaster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header>
        <h1>🌍 GeoMaster</h1>
        <p>Explore the world. Master geography.</p>
    </header>

    <section id="menu" class="panel">
        <h2>Choose Your Challenge</h2>

        <div class="regions">
            <label><input type="checkbox" value="Europe" checked> Europe</label>
            <label><input type="checkbox" value="Asia" checked> Asia</label>
            <label><input type="checkbox" value="North America" checked> North America</label>
            <label><input type="checkbox" value="South America" checked> South America</label>
            <label><input type="checkbox" value="Africa" checked> Africa</label>
        </div>

        <div class="mode-grid">
            <button onclick="startGame('flag')">🚩 Flag Quiz</button>
            <button onclick="startGame('capital')">🏙️ Capital Quiz</button>
            <button onclick="startGame('country')">🌎 Country Quiz</button>
            <button onclick="startGame('map')">🗺️ Map Quiz</button>
            <button onclick="startGame('random')">🎲 Random Mode</button>
            <button onclick="startGame('timeAttack')">⏱️ Time Attack</button>
        </div>

        <div class="rank-panel">
            <h3 id="currentRank">🌱 Beginner</h3>
            <p>Total XP: <span id="totalXP">0</span></p>
            <div class="xp-track">
                <div id="xpProgress"></div>
            </div>
            <p id="nextRank"></p>
        </div>
    </section>

    <section id="game" class="panel hidden">

        <div class="game-stats">
            <div>⭐ Score: <span id="score">0</span></div>
            <div>❓ Question: <span id="number">1</span></div>
            <div id="timerBox" class="hidden">
                ⏱️ <span id="timer">30</span>s
            </div>
        </div>

        <div id="timer">
            30
        </div>

        <div id="flag"></div>

        <div id="countryMap"></div>

        <h2 id="question">Loading question...</h2>

        <div id="options" class="options"></div>

        <h3 id="feedback"></h3>

        <button id="next" class="next-button">Next Question →</button>

        <button onclick="backToMenu()" class="back-button">← Main Menu</button>

    </section>

    <section id="result" class="panel hidden">
        <h2>🏆 Game Finished!</h2>
        <h1 id="finalScore">0</h1>
        <h3 id="finalMessage"></h3>
        <p>Total XP: <span id="finalXP">0</span></p>
        <p>Rank: <span id="finalRank"></span></p>
        <button onclick="restartGame()">🔄 Play Again</button>
        <button onclick="backToMenu()">Main Menu</button>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
